<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none">
  <style>
    .orbit{transform-origin:120px 100px;animation:orbit 4s linear infinite}
    .halo{transform-origin:120px 100px;animation:breathe 2.4s ease-in-out infinite}
    .bar{transform-box:fill-box;transform-origin:center bottom;animation:bar 1.8s ease-in-out infinite}
    .bar-two{animation-delay:-.6s}.bar-three{animation-delay:-1.2s}
    .trend{stroke-dasharray:100;stroke-dashoffset:100;animation:trend 2.8s ease-in-out infinite}
    .signal{animation:signal 1.8s ease-in-out infinite}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @keyframes breathe{0%,100%{opacity:.35;transform:scale(.95)}50%{opacity:.8;transform:scale(1.05)}}
    @keyframes bar{0%,100%{transform:scaleY(.55);opacity:.55}50%{transform:scaleY(1);opacity:1}}
    @keyframes trend{0%{stroke-dashoffset:100;opacity:0}20%{opacity:1}65%,85%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
    @keyframes signal{0%,100%{opacity:.3}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.orbit,.halo,.bar,.trend,.signal{animation:none}.trend{stroke-dashoffset:0}.halo{opacity:.5}}
  </style>
  <circle class="halo" cx="120" cy="100" r="72" fill="#3b82f6" fill-opacity=".08"/>
  <circle cx="120" cy="100" r="84" stroke="#3b82f6" stroke-opacity=".12"/>
  <g class="orbit">
    <path d="M120 16a84 84 0 0 1 79 55" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
    <path d="M120 184a84 84 0 0 1-79-55" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
    <circle cx="120" cy="16" r="4" fill="#3b82f6"/>
    <circle cx="120" cy="184" r="4" fill="#06b6d4"/>
  </g>
  <rect x="62" y="57" width="116" height="86" rx="12" fill="#3b82f6" fill-opacity=".06" stroke="#3b82f6" stroke-opacity=".55" stroke-width="1.5"/>
  <path d="M62 78h116" stroke="#3b82f6" stroke-opacity=".2"/>
  <circle cx="74" cy="68" r="2" fill="#3b82f6"/>
  <circle cx="82" cy="68" r="2" fill="#3b82f6" fill-opacity=".4"/>
  <path d="M150 68h16" stroke="#3b82f6" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>
  <path d="M77 129h86" stroke="#3b82f6" stroke-opacity=".2" stroke-linecap="round"/>
  <rect class="bar" x="80" y="108" width="13" height="17" rx="3" fill="#3b82f6"/>
  <rect class="bar bar-two" x="103" y="98" width="13" height="27" rx="3" fill="#3b82f6" fill-opacity=".75"/>
  <rect class="bar bar-three" x="126" y="89" width="13" height="36" rx="3" fill="#06b6d4"/>
  <path class="trend" d="m78 105 23-14 20 5 20-13 20 4" pathLength="100" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="signal" cx="161" cy="87" r="3.5" fill="#38bdf8"/>
  <path d="M183 46v8m-4-4h8M48 145v6m-3-3h6" stroke="#3b82f6" stroke-opacity=".4" stroke-width="1.5" stroke-linecap="round"/>
</svg>
